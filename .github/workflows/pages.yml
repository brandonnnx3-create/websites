name: Publicar sitio en GitHub Pages

# Solo desde main. Publicar desde una rama de trabajo era fragil: el sitio en
# produccion quedaba atado a una rama que en algun momento se borra, y el
# environment "github-pages" ademas restringe desde que ramas se puede
# desplegar, asi que cualquier rama nueva falla antes de correr un paso.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tn-baires-sitio
      - id: deployment
        uses: actions/deploy-pages@v4
